<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CCTV System{% endblock %}</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- CCTV System Styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

  {% block extra_head %}{% endblock %}
</head>
<body {% block body_class %}{% endblock %}>

<div class="{% block container_class %}container{% endblock %}">

  {% block nav %}
  <div class="nav">
    <a href="/"><i class="fa-solid fa-house"></i> Dashboard</a>
    <a href="/logs"><i class="fa-solid fa-clock-rotate-left"></i> Logs</a>
    <a href="/logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
  </div>
  {% endblock %}

  {% block content %}
  <div class="card">
    <h1>Page Title</h1>
    <p>Your content goes here.</p>
  </div>
  {% endblock %}

</div>

<!-- CCTV System Scripts -->
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block extra_scripts %}{% endblock %}

</body>
</html>
