<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCTV System Login</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="auth-page">

<div class="auth-container">

  <div class="login-card">

    <div class="logo">
      <div class="shield">
        <i class="fa-solid fa-camera"></i>
      </div>
      <h1>CCTV LOGIN</h1>
      <div class="subtitle">Secure Surveillance Access</div>
      <div class="divider"></div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="message {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="/login">

      <div class="input-group">
        <label>USERNAME</label>
        <div class="input-box">
          <i class="fa-solid fa-user icon"></i>
          <input name="username" placeholder="Enter username" required>
        </div>
      </div>

      <div class="input-group">
        <label>PASSWORD</label>
        <div class="input-box">
          <i class="fa-solid fa-lock icon"></i>
          <input id="password" name="password" type="password" placeholder="Enter password" required>
          <i class="fa-regular fa-eye icon eye" id="togglePassword"></i>
        </div>
      </div>

      <div class="options">
        <label><input type="checkbox"> Remember me</label>
        <a href="#">Forgot Password?</a>
      </div>

      <button type="submit">LOGIN</button>

    </form>

    <p style="text-align:center; margin-top:18px; font-size:13px;">
      Don't have an account?
      <a href="/signup" class="accent-link">Sign up</a>
    </p>

  </div>

  <div class="side-text">
    AUTHORIZED<br>PERSONNEL ONLY
  </div>

</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
