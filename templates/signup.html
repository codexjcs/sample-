<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — CCTV System</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="auth-page">

<div class="auth-container">

  <div class="signup-card">

    <div class="logo">
      <div class="shield">
        <i class="fa-solid fa-user-plus"></i>
      </div>
      <h1>CREATE ACCOUNT</h1>
      <div class="subtitle">Register New CCTV User</div>
      <div class="divider"></div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="message {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="/signup">

      <div class="input-group">
        <label>USERNAME</label>
        <div class="input-box">
          <i class="fa-solid fa-user icon"></i>
          <input name="username" placeholder="Enter username" required minlength="3" maxlength="80">
        </div>
      </div>

      <div class="input-group">
        <label>EMAIL</label>
        <div class="input-box">
          <i class="fa-solid fa-envelope icon"></i>
          <input name="email" type="email" placeholder="Enter email" required>
        </div>
      </div>

      <div class="input-group">
        <label>PASSWORD</label>
        <div class="input-box">
          <i class="fa-solid fa-lock icon"></i>
          <input id="password" name="password" type="password" placeholder="Minimum 8 characters" required minlength="8">
          <i class="fa-regular fa-eye icon eye" id="togglePassword"></i>
        </div>
      </div>

      <div class="input-group">
        <label>CONFIRM PASSWORD</label>
        <div class="input-box">
          <i class="fa-solid fa-lock icon"></i>
          <input id="confirmPassword" name="confirm_password" type="password" placeholder="Re-enter password" required>
          <i class="fa-regular fa-eye icon eye" id="toggleConfirm"></i>
        </div>
      </div>

      <button type="submit" style="margin-top:10px;">CREATE ACCOUNT</button>

    </form>

    <div class="bottom-link">
      Already have an account?
      <a href="/login">Log in</a>
    </div>

  </div>

  <div class="side-text">
    CCTV USER<br>REGISTRATION
  </div>

</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
